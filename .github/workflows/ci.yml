name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Отримати код
        uses: actions/checkout@v6

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити властивості
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Запустити тести
        run: |
          python --version
          python -m pytest -v

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Зібрати Docker-образ
        run: |
          IMAGE=ghcr.io/andr77eeeew/ci-lab-app
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Опублікувати Docker-образ
        run: |
          IMAGE=ghcr.io/andr77eeeew/ci-lab-app
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
