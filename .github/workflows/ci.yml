name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Отримати код
        uses: actions/checkout@v6

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити властивості
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Запустити тести
        run: |
          python --version
          python -m pytest -v

  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_image_name: ghcr.io/andr77eeeew/ci-lab-app:${{ github.sha }}

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Встановити Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Перевірити форматування Terraform
        working-directory: infra
        run: terraform fmt -check

      - name: terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Перевірити конфігурацію Terraform
        working-directory: infra
        run: terraform validate

      - name: terraform plan
        working-directory: infra
        run: terraform plan -input=false

      - name: terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

      - name: Вивести ідентифікатори ресурсів
        working-directory: infra
        run: terraform output

      - name: Перевірити результат розгортання (smoke-test)
        timeout-minutes: 2
        run: |
          docker wait ci-lab-deploy
          docker logs ci-lab-deploy
          EXIT_CODE=$(docker inspect ci-lab-deploy --format='{{.State.ExitCode}}')
          echo "Код завершення контейнера: $EXIT_CODE"
          test "$EXIT_CODE" -eq 0

      - name: terraform destroy
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve -input=false

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Зібрати Docker-образ
        run: |
          IMAGE=ghcr.io/andr77eeeew/ci-lab-app
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Опублікувати Docker-образ
        run: |
          IMAGE=ghcr.io/andr77eeeew/ci-lab-app
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
